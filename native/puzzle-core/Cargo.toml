[package]
name = "puzzle-core"
version = "0.1.0"
edition = "2021"
description = "Puzzle image splitter — native library with C FFI for mobile (Android/iOS)"

[lib]
name = "puzzle_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
image = "0.25"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# For Android/iOS, we don't need colored terminal output
# colored is removed — only needed for CLI display
